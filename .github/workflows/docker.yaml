name: Docker Build and Test Workflow

on:
  push:
    branches: ["**"]
  release:
    types: [published, prereleased]

jobs:
  test:
    name: Test Build on Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image for testing
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          # build only for current architecture (usually linux/amd64) to enable local loading
          platforms: linux/amd64
          tags: dockstatapi:test

  release:
    name: Build and Push Docker Image on Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Determine image tag
        id: tag
        run: |
          TAG=${GITHUB_REF##*/}
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            TAG="${TAG}-rc"
          fi
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "Using tag: $TAG"

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ghcr.io/${{ github.repository_owner }}/dockstatapi:${{ env.IMAGE_TAG }}
