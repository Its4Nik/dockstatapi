name: Docker Build and Test Workflow

on:
  push:
    branches: ["**"]
  release:
    types: [published, prereleased]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Build on Push
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
        name: Setup Bun
        with:
          bun-version: latest

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start proxy
        run: |
          pwd
          ls -lah
          docker compose -f docker/docker-compose.dev.yaml up -d

      - name: Run Unit-tests
        run: |
          bun install
          bun clean
          bun test

      - name: Run Docker Build
        run: |
          bun build:docker

      - name: Start Docker container and check uptime
        run: |
          docker run --name dockstatapi --rm -d dockstatapi:local
          sleep 30
          if docker ps --filter "name=dockstatapi" --filter "status=running" | grep dockstatapi; then
            docker kill dockstatapi
            exit 0
          else
            exit 1
          fi

  release:
    name: Build and Push Docker Image on Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          TAG=${GITHUB_REF##*/}
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            TAG="${TAG}-rc"
          fi
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "Using tag: $TAG"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/its4nik/dockstatapi:${{ env.IMAGE_TAG }}
