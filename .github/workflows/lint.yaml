name: Lint

on:
  push:
  pull_request:

jobs:
  lint-test:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Knip check
        if: ${{ github.event_name == 'pull_request' }}
        uses: codex-/knip-reporter@v2

      - name: Run linter
        run: |
          bun biome format --fix
          bun biome lint --fix
          bun biome check --fix
          bun biome ci

      - name: Add linted files
        run: git add src/

      - name: Check for changes
        id: check-changes
        run: |
          git diff --cached --quiet || echo "changes_detected=true" >> $GITHUB_OUTPUT

      - name: Commit and push lint changes
        if: |
          steps.check-changes.outputs.changes_detected == 'true' &&
          github.event_name == 'push'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit -m "CQL: Apply lint fixes [skip ci]"
          git push
